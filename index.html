<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucía, la niña que transformó lo roto</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería PDF.js para leer el PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Librería PageFlip para el efecto de pasar página -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <header class="header">
        <h1>Lucía, la niña que transformó lo roto</h1>
        <p>Un cuento mágico para leer, escuchar y descubrir.</p>
        
        <!-- Barra de herramientas de Accesibilidad y Navegación -->
        <div class="toolbar">
            <div class="accessibility-group">
                <button id="speak-btn" class="tool-btn" title="Leer página en voz alta">🔊 Leer cuento</button>
                <button id="zoom-in" class="tool-btn" title="Agrandar texto o vista">A+</button>
                <button id="zoom-out" class="tool-btn" title="Achicar texto o vista">A-</button>
            </div>
            <div class="nav-group">
                <button id="prev-btn" class="nav-btn">◀ Página Anterior</button>
                <span id="page-indicator">Página 1 / ?</span>
                <button id="next-btn" class="nav-btn">Página Siguiente ▶</button>
                <p class="iag-statement">Este cuento fue creado con la asistencia de IAG a través de Gemini, apoyado en la creación de imágenes y el recurso de navegación que contiene.</p>
            </div>
        </div>
        
        <div id="loading">Cargando cuento mágico...</div>
    </header>

    <main class="book-container">
        <!-- El flipbook se generará aquí -->
        <div id="flip-book" class="flip-book"></div>
    </main>

    <!-- Efecto de sonido al pasar página (Audio sintético por Web Audio API o archivo local) -->
    <script src="script.js"></script>
</body>
</html>
